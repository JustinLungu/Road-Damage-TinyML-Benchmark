sonar.projectKey=cascaded-tinyvlm
sonar.projectName=Cascaded TinyVLM
sonar.sourceEncoding=UTF-8

sonar.sources=src,experiments
sonar.tests=tests

sonar.exclusions=.venv/**,models/**,datasets/**,results/**,**/__pycache__/**,**/*.png,**/*.csv
sonar.coverage.exclusions=src/constants.py,src/**/constants.py

sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=reports/pytest.xml