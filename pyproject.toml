[project]
name = "cascaded-tinyvlm"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=0.21.0",
    "gitpython>=3.1.30",
    "numpy>=2.2.6",
    "nvidia-ml-py>=13.610.43",
    "pandas>=1.1.4",
    "pycocotools>=2.0.7",
    "psutil>=7.2.2",
    "seaborn>=0.11.0",
    "sentencepiece>=0.1.99",
    "timm>=0.9.12",
    "transformers>=4.49,<5",
    "ultralytics>=8.4.60",
]

[dependency-groups]
dev = [
    "pysonar>=1.6.0.4905",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.15",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
]
